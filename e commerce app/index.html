<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Realistic E-commerce Store</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0; padding: 0;
      background: #f5f5f5;
      color: #333;
    }
    header {
      background-color: #007bff;
      color: white;
      padding: 1rem;
      text-align: center;
      font-size: 1.8rem;
      font-weight: bold;
      letter-spacing: 1.2px;
    }
    main {
      max-width: 900px;
      margin: 2rem auto;
      display: flex;
      gap: 2rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    .products, .cart {
      background: white;
      padding: 1rem;
      border-radius: 6px;
      box-shadow: 0 0 8px rgba(0,0,0,0.1);
      flex: 1 1 400px;
      min-width: 320px;
    }
    .products h2, .cart h2 {
      margin-top: 0;
      margin-bottom: 1rem;
      border-bottom: 2px solid #007bff;
      padding-bottom: 0.5rem;
    }
    .product {
      display: flex;
      border-bottom: 1px solid #ddd;
      padding: 1rem 0;
      align-items: center;
    }
    .product:last-child {
      border-bottom: none;
    }
    .product img {
      width: 80px;
      height: 80px;
      object-fit: contain;
      margin-right: 1rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: #fff;
    }
    .product-details {
      flex: 1;
    }
    .product-title {
      font-size: 1.1rem;
      margin: 0 0 0.3rem 0;
    }
    .product-price {
      color: #007bff;
      font-weight: bold;
      margin-bottom: 0.5rem;
    }
    .add-btn {
      padding: 0.5rem 1rem;
      background-color: #007bff;
      border: none;
      color: white;
      cursor: pointer;
      border-radius: 4px;
      font-weight: 600;
      transition: background-color 0.3s ease;
    }
    .add-btn:hover {
      background-color: #0056b3;
    }
    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #eee;
      padding: 0.7rem 0;
    }
    .cart-item:last-child {
      border-bottom: none;
    }
    .cart-item-info {
      flex: 1;
    }
    .cart-item-title {
      margin: 0;
      font-weight: 600;
    }
    .cart-item-qty {
      width: 50px;
      margin-right: 1rem;
    }
    .cart-item-price {
      min-width: 80px;
      text-align: right;
      font-weight: bold;
      color: #007bff;
    }
    .remove-btn {
      background: none;
      border: none;
      color: #dc3545;
      font-weight: bold;
      cursor: pointer;
      font-size: 1.1rem;
    }
    .cart-total {
      margin-top: 1rem;
      font-size: 1.3rem;
      font-weight: bold;
      text-align: right;
    }
    .checkout-btn {
      margin-top: 1rem;
      width: 100%;
      background-color: #28a745;
      color: white;
      border: none;
      padding: 0.8rem;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      border-radius: 6px;
      transition: background-color 0.3s ease;
    }
    .checkout-btn:hover {
      background-color: #1e7e34;
    }
    @media (max-width: 700px) {
      main {
        flex-direction: column;
        margin: 1rem;
      }
    }
  </style>
</head>
<body>

<header>
  Realistic E-commerce Store
</header>

<main>
  <section class="products">
    <h2>Products</h2>
    <div id="productList">
      <!-- Products will be injected here -->
    </div>
  </section>

  <section class="cart">
    <h2>🛒 Cart</h2>
    <div id="cartList">
      <p>Your cart is empty.</p>
    </div>
    <div class="cart-total" id="cartTotal"></div>
    <button class="checkout-btn" id="checkoutBtn" style="display:none;">Checkout</button>
  </section>
</main>

<script>
  // Sample products data
  const products = [
    {
      id: 1,
      title: "Wireless Headphones",
      price: 59.99,
      image: "https://images.unsplash.com/photo-1516728778615-2d590ea1856f?auto=format&fit=crop&w=80&q=80"
    },
    {
      id: 2,
      title: "Smartwatch",
      price: 99.99,
      image: "https://images.unsplash.com/photo-1517430816045-df4b7de963c9?auto=format&fit=crop&w=80&q=80"
    },
    {
      id: 3,
      title: "Digital Camera",
      price: 199.99,
      image: "https://images.unsplash.com/photo-1519183071298-a2962cc0182a?auto=format&fit=crop&w=80&q=80"
    },
    {
      id: 4,
      title: "Portable Speaker",
      price: 29.99,
      image: "https://images.unsplash.com/photo-1519669556871-0b76bce874b3?auto=format&fit=crop&w=80&q=80"
    }
  ];

  const productListEl = document.getElementById('productList');
  const cartListEl = document.getElementById('cartList');
  const cartTotalEl = document.getElementById('cartTotal');
  const checkoutBtn = document.getElementById('checkoutBtn');

  let cart = JSON.parse(localStorage.getItem('cart')) || [];

  // Render products
  function renderProducts() {
    productListEl.innerHTML = '';
    products.forEach(product => {
      const productEl = document.createElement('div');
      productEl.className = 'product';

      productEl.innerHTML = `
        <img src="${product.image}" alt="${product.title}">
        <div class="product-details">
          <h3 class="product-title">${product.title}</h3>
          <p class="product-price">$${product.price.toFixed(2)}</p>
        </div>
        <button class="add-btn" onclick="addToCart(${product.id})">Add to Cart</button>
      `;

      productListEl.appendChild(productEl);
    });
  }

  // Add product to cart
  function addToCart(productId) {
    const product = products.find(p => p.id === productId);
    if (!product) return;

    const existingItem = cart.find(item => item.id === productId);
    if (existingItem) {
      existingItem.quantity++;
    } else {
      cart.push({...product, quantity: 1});
    }
    saveCart();
    renderCart();
  }

  // Remove product from cart
  function removeFromCart(productId) {
    cart = cart.filter(item => item.id !== productId);
    saveCart();
    renderCart();
  }

  // Update quantity
  function updateQuantity(productId, qty) {
    const item = cart.find(i => i.id === productId);
    if (!item) return;

    qty = parseInt(qty);
    if (isNaN(qty) || qty < 1) {
      qty = 1;
    }
    item.quantity = qty;
    saveCart();
    renderCart();
  }

  // Render cart UI
  function renderCart() {
    cartListEl.innerHTML = '';
    if (cart.length === 0) {
      cartListEl.innerHTML = '<p>Your cart is empty.</p>';
      cartTotalEl.textContent = '';
      checkoutBtn.style.display = 'none';
      return;
    }

    cart.forEach(item => {
      const cartItemEl = document.createElement('div');
      cartItemEl.className = 'cart-item';

      cartItemEl.innerHTML = `
        <div class="cart-item-info">
          <p class="cart-item-title">${item.title}</p>
          <input type="number" class="cart-item-qty" min="1" value="${item.quantity}" onchange="updateQuantity(${item.id}, this.value)">
        </div>
        <p class="cart-item-price">$${(item.price * item.quantity).toFixed(2)}</p>
        <button class="remove-btn" onclick="removeFromCart(${item.id})" title="Remove item">&times;</button>
      `;

      cartListEl.appendChild(cartItemEl);
    });

    const total = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);
    cartTotalEl.textContent = `Total: $${total.toFixed(2)}`;
    checkoutBtn.style.display = 'block';
  }

  // Save cart to localStorage
  function saveCart() {
    localStorage.setItem('cart', JSON.stringify(cart));
  }

  // Checkout (simple alert)
  checkoutBtn.onclick = () => {
    if (cart.length === 0) return alert("Your cart is empty.");

    alert(`Thank you for your purchase!\nTotal: $${cart.reduce((sum, item) => sum + item.price * item.quantity, 0).toFixed(2)}`);
    cart = [];
    saveCart();
    renderCart();
  };

  // Initial render
  renderProducts();
  renderCart();

  // Make functions global for inline handlers
  window.addToCart = addToCart;
  window.removeFromCart = removeFromCart;
  window.updateQuantity = updateQuantity;

</script>

</body>
</html>
