<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .calculator {
            background: #2a2a2a;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            max-width: 350px;
            width: 100%;
        }

        .display {
            background: #1a1a1a;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            border: 2px solid #444;
        }

        #screen {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 2.5em;
            text-align: right;
            width: 100%;
            outline: none;
            font-weight: 300;
            letter-spacing: 1px;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        button {
            border: none;
            border-radius: 15px;
            font-size: 1.3em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .number {
            background: linear-gradient(145deg, #4a4a4a, #3a3a3a);
            color: #fff;
            border: 2px solid #555;
        }

        .number:hover {
            background: linear-gradient(145deg, #5a5a5a, #4a4a4a);
        }

        .operator {
            background: linear-gradient(145deg, #ff6b6b, #ee5a52);
            color: #fff;
            border: 2px solid #ff8a80;
        }

        .operator:hover {
            background: linear-gradient(145deg, #ff8a80, #ff6b6b);
        }

        .equals {
            background: linear-gradient(145deg, #51cf66, #40c057);
            color: #fff;
            border: 2px solid #69db7c;
        }

        .equals:hover {
            background: linear-gradient(145deg, #69db7c, #51cf66);
        }

        .clear {
            background: linear-gradient(145deg, #ffd43b, #fab005);
            color: #333;
            border: 2px solid #ffe066;
        }

        .clear:hover {
            background: linear-gradient(145deg, #ffe066, #ffd43b);
        }

        .zero {
            grid-column: span 2;
        }

        /* Ripple effect */
        button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transition: width 0.6s, height 0.6s, top 0.6s, left 0.6s;
            transform: translate(-50%, -50%);
        }

        button:active::before {
            width: 300px;
            height: 300px;
            top: 50%;
            left: 50%;
        }

        .title {
            text-align: center;
            color: #fff;
            margin-bottom: 20px;
            font-size: 1.5em;
            font-weight: 300;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <div class="title">CALCULATOR</div>
        <div class="display">
            <input type="text" id="screen" readonly>
        </div>
        <div class="buttons">
            <button class="clear" onclick="clearScreen()">AC</button>
            <button class="clear" onclick="deleteLast()">⌫</button>
            <button class="operator" onclick="appendToScreen('/')">/</button>
            <button class="operator" onclick="appendToScreen('*')">×</button>
            
            <button class="number" onclick="appendToScreen('7')">7</button>
            <button class="number" onclick="appendToScreen('8')">8</button>
            <button class="number" onclick="appendToScreen('9')">9</button>
            <button class="operator" onclick="appendToScreen('-')">-</button>
            
            <button class="number" onclick="appendToScreen('4')">4</button>
            <button class="number" onclick="appendToScreen('5')">5</button>
            <button class="number" onclick="appendToScreen('6')">6</button>
            <button class="operator" onclick="appendToScreen('+')">+</button>
            
            <button class="number" onclick="appendToScreen('1')">1</button>
            <button class="number" onclick="appendToScreen('2')">2</button>
            <button class="number" onclick="appendToScreen('3')">3</button>
            <button class="equals" onclick="calculateResult()" rowspan="2">=</button>
            
            <button class="number zero" onclick="appendToScreen('0')">0</button>
            <button class="number" onclick="appendToScreen('.')">.</button>
        </div>
    </div>

    <script>
        let screen = document.getElementById('screen');
        let currentInput = '';
        let operator = '';
        let previousInput = '';

        function appendToScreen(value) {
            if (['+', '-', '*', '/'].includes(value)) {
                if (currentInput === '') return;
                if (previousInput !== '' && currentInput !== '') {
                    calculateResult();
                }
                operator = value;
                previousInput = currentInput;
                currentInput = '';
                screen.value = previousInput + ' ' + (value === '*' ? '×' : value) + ' ';
            } else {
                currentInput += value;
                if (operator && previousInput) {
                    screen.value = previousInput + ' ' + (operator === '*' ? '×' : operator) + ' ' + currentInput;
                } else {
                    screen.value = currentInput;
                }
            }
        }

        function clearScreen() {
            screen.value = '';
            currentInput = '';
            operator = '';
            previousInput = '';
        }

        function deleteLast() {
            if (currentInput) {
                currentInput = currentInput.slice(0, -1);
                if (operator && previousInput) {
                    screen.value = previousInput + ' ' + (operator === '*' ? '×' : operator) + ' ' + currentInput;
                } else {
                    screen.value = currentInput;
                }
            } else if (operator) {
                operator = '';
                currentInput = previousInput;
                previousInput = '';
                screen.value = currentInput;
            }
        }

        function calculateResult() {
            if (previousInput === '' || currentInput === '' || operator === '') {
                return;
            }

            let result;
            const prev = parseFloat(previousInput);
            const current = parseFloat(currentInput);

            if (isNaN(prev) || isNaN(current)) return;

            switch (operator) {
                case '+':
                    result = prev + current;
                    break;
                case '-':
                    result = prev - current;
                    break;
                case '*':
                    result = prev * current;
                    break;
                case '/':
                    if (current === 0) {
                        screen.value = 'Error';
                        clearScreen();
                        return;
                    }
                    result = prev / current;
                    break;
                default:
                    return;
            }

            // Round to avoid floating point precision issues
            result = Math.round((result + Number.EPSILON) * 100000000) / 100000000;
            
            screen.value = result;
            currentInput = result.toString();
            operator = '';
            previousInput = '';
        }

        // Keyboard support
        document.addEventListener('keydown', function(event) {
            const key = event.key;
            
            if (key >= '0' && key <= '9' || key === '.') {
                appendToScreen(key);
            } else if (['+', '-', '*', '/'].includes(key)) {
                appendToScreen(key);
            } else if (key === 'Enter' || key === '=') {
                event.preventDefault();
                calculateResult();
            } else if (key === 'Escape' || key.toLowerCase() === 'c') {
                clearScreen();
            } else if (key === 'Backspace') {
                event.preventDefault();
                deleteLast();
            }
        });
    </script>
</body>
</html>
