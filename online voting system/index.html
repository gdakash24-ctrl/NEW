<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Online Voting System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Vote for Your Favorite Candidate</h1>
        <form id="voteForm">
            <label>
                <input type="radio" name="candidate" value="AKASH"> Akash
            </label><br>
            <label>
                <input type="radio" name="candidate" value="SANJAY"> Sanjay
            </label><br>
            <label>
                <input type="radio" name="candidate" value="THULASIVEL"> Thulasivel
            </label><br><br>
            <button type="submit">Submit Vote</button>
        </form>
        <p id="resultMessage"></p>
    </div>
    <script src="script.js"></script>
</body>
</html>
